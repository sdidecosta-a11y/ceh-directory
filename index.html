            const introOverlay = document.getElementById('intro-overlay');
            const introVideo = document.getElementById('intro-video');
            const skipBtn = document.getElementById('skip-btn');
            let isDismissed = false;
            
            function dismissIntro() {
                if(isDismissed) return;
                isDismissed = true;
                introOverlay.classList.add('opacity-0');
                introOverlay.classList.add('pointer-events-none');
                setTimeout(() => {
                    introOverlay.style.display = 'none';
                    document.body.classList.remove('intro-active');
                }, 700); 
            }

            introVideo.addEventListener('ended', dismissIntro);
            skipBtn.addEventListener('click', dismissIntro);
            setTimeout(dismissIntro, 8000);

            let playPromise = introVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    dismissIntro();
                });
            }
        });

        function renderCards(filter = 'all') {
            const grid = document.getElementById('directory-grid');
            grid.innerHTML = ''; 
            const filteredData = filter === 'all' ? directoryData : directoryData.filter(item => item.category === filter);

            filteredData.forEach(item => {
                const isEmergency = item.isEmergency || false;
                let cardBgClass = '', btnStyleClass = '', titleColor = '';

                switch(item.category) {
                    case 'food': cardBgClass = 'bg-emerald-50 border-emerald-200 hover:bg-emerald-100'; btnStyleClass = 'bg-emerald-100 text-emerald-800 hover:bg-emerald-600 hover:text-white border-emerald-200'; titleColor = 'text-emerald-900'; break;
                    case 'transport': cardBgClass = 'bg-sky-50 border-sky-200 hover:bg-sky-100'; btnStyleClass = 'bg-sky-100 text-sky-800 hover:bg-sky-600 hover:text-white border-sky-200'; titleColor = 'text-sky-900'; break;
                    case 'finance': cardBgClass = 'bg-blue-50 border-blue-200 hover:bg-blue-100'; btnStyleClass = 'bg-blue-100 text-blue-800 hover:bg-blue-600 hover:text-white border-blue-200'; titleColor = 'text-blue-900'; break;
                    case 'health': cardBgClass = 'bg-teal-50 border-teal-200 hover:bg-teal-100'; btnStyleClass = 'bg-teal-100 text-teal-800 hover:bg-teal-600 hover:text-white border-teal-200'; titleColor = 'text-teal-900'; break;
                    case 'worship': cardBgClass = 'bg-orange-50 border-orange-200 hover:bg-orange-100'; btnStyleClass = 'bg-orange-100 text-orange-800 hover:bg-orange-600 hover:text-white border-orange-200'; titleColor = 'text-orange-900'; break;
                    case 'utility': cardBgClass = 'bg-slate-100 border-slate-200 hover:bg-slate-200'; btnStyleClass = 'bg-slate-200 text-slate-800 hover:bg-slate-600 hover:text-white border-slate-300'; titleColor = 'text-slate-900'; break;
                    case 'shopping': cardBgClass = 'bg-fuchsia-50 border-fuchsia-200 hover:bg-fuchsia-100'; btnStyleClass = 'bg-fuchsia-100 text-fuchsia-800 hover:bg-fuchsia-600 hover:text-white border-fuchsia-200'; titleColor = 'text-fuchsia-900'; break;
                    case 'drinks': cardBgClass = 'bg-indigo-50 border-indigo-200 hover:bg-indigo-100'; btnStyleClass = 'bg-indigo-100 text-indigo-800 hover:bg-indigo-600 hover:text-white border-indigo-200'; titleColor = 'text-indigo-900'; break;
                    case 'emergency': cardBgClass = 'bg-red-50 border-red-300 hover:bg-red-100 shadow-md'; btnStyleClass = 'bg-red-600 text-white hover:bg-red-700 border-red-700 shadow-sm'; titleColor = 'text-red-900 font-bold'; break;
                    default: cardBgClass = 'bg-white border-gray-200 hover:bg-gray-50'; btnStyleClass = 'bg-gray-100 text-gray-800 hover:bg-gray-600 hover:text-white border-gray-200'; titleColor = 'text-gray-900';
                }

                const finalCardClass = `${cardBgClass} border shadow-sm rounded-xl p-3 flex items-center justify-between transition-all duration-200 transform hover:-translate-y-1 w-full`;
                let buttonHTML = '';
                
                if (item.link && item.link !== '#') {
                    const linkTarget = item.link.startsWith('tel:') ? '' : 'target="_blank"';
                    const btnText = isEmergency ? (item.note || 'Call') : 'Map <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-[10px]"></i>';
                    buttonHTML = `<a href="${item.link}" ${linkTarget} class="${btnStyleClass} border px-3 py-2 rounded-lg text-xs font-bold uppercase tracking-wider flex-shrink-0 ml-2 text-center min-w-[70px] sm:min-w-[80px] transition-colors">${btnText}</a>`;
                } else if (item.note) {
                    const badgeText = item.note || 'Info';
                    buttonHTML = `<span class="bg-white/60 text-slate-500 border border-slate-200 px-3 py-2 rounded-lg text-[10px] font-bold uppercase tracking-wider flex-shrink-0 ml-2 text-center min-w-[70px] sm:min-w-[80px]">${badgeText}</span>`;
                }

                const subtitleHTML = item.subtitle ? `<div class="text-[11px] text-slate-500 leading-tight mt-0.5 whitespace-normal pr-2">${item.subtitle}</div>` : '';
                const distanceHTML = item.dist ? `<div class="text-[11px] font-medium opacity-80 mt-1 flex items-center"><i class="fa-solid fa-person-walking mr-1.5 opacity-70"></i>~${item.dist}</div>` : '';

                const cardHTML = `
                    <div class="${finalCardClass}">
                        <div class="flex items-center gap-3 w-full max-w-[calc(100%-80px)]">
                            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-sm flex-shrink-0">
                                <i class="fa-solid ${item.icon} ${item.color} text-lg"></i>
                            </div>
                            <div class="flex flex-col min-w-0 pr-1 w-full">
                                <h3 class="${titleColor} ${!isEmergency ? 'font-bold' : ''} text-sm leading-tight truncate w-full" title="${item.title}">${item.title}</h3>
                                ${subtitleHTML}
                                ${distanceHTML}
                            </div>
                        </div>
                        ${buttonHTML}
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        function filterItems(category, btnElement) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                const classes = btn.className.split(' ').filter(c => !c.startsWith('bg-') && !c.startsWith('text-') && !c.startsWith('border-') || c.includes('hover:'));
                btn.className = classes.join(' ');
                btn.classList.add('bg-white', 'border-gray-300', 'text-gray-700');
            });
            
            btnElement.classList.add('active');
            btnElement.classList.remove('bg-white', 'text-gray-700', 'border-gray-300');
            
            switch(category) {
                case 'all': btnElement.classList.add('bg-emerald-600', 'text-white', 'border-emerald-600'); break;
                case 'food': btnElement.classList.add('bg-emerald-600', 'text-white', 'border-emerald-600'); break;
                case 'transport': btnElement.classList.add('bg-sky-600', 'text-white', 'border-sky-600'); break;
                case 'finance': btnElement.classList.add('bg-blue-600', 'text-white', 'border-blue-600'); break;
                case 'health': btnElement.classList.add('bg-teal-600', 'text-white', 'border-teal-600'); break;
                case 'worship': btnElement.classList.add('bg-orange-600', 'text-white', 'border-orange-600'); break;
                case 'utility': btnElement.classList.add('bg-slate-600', 'text-white', 'border-slate-600'); break;
                case 'shopping': btnElement.classList.add('bg-fuchsia-600', 'text-white', 'border-fuchsia-600'); break;
                case 'drinks': btnElement.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600'); break;
                case 'emergency': btnElement.classList.add('bg-red-600', 'text-white', 'border-red-600'); break;
            }
            renderCards(category);
        }
        renderCards('all');
    </script>
